name: hmde

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hmde}
      POSTGRES_USER: ${POSTGRES_USER:-hmde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hmde_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hmde}:${POSTGRES_PASSWORD:-hmde_dev}@db:5432/${POSTGRES_DB:-hmde}
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres_data:
  frontend_node_modules:
