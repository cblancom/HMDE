name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hmde_test
          POSTGRES_USER: hmde
          POSTGRES_PASSWORD: hmde_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hmde -d hmde_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://hmde:hmde_dev@localhost:5432/hmde
      TEST_DATABASE_URL: postgresql+psycopg://hmde:hmde_dev@localhost:5432/hmde_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.21"
          python-version: "3.13"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Lint backend
        run: uv run ruff check .

      - name: Check backend formatting
        run: uv run ruff format --check .

      - name: Test backend
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build
